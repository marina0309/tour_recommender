<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Рекомендатель туров – путешествуйте осознанно</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #d4e2e9 0%, #eaf3f0 100%);
            color: #1e3b44;
            line-height: 1.5;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1f6d5c, #3c9b85, #d9a13b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .header p {
            color: #2b6a6f;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .two-columns {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .filters-sidebar {
            flex: 1.2;
            min-width: 300px;
            background: rgba(255,248,235,0.92);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            padding: 26px;
            position: sticky;
            top: 20px;
            height: fit-content;
            border: 1px solid rgba(255,215,170,0.6);
        }
        .results-area {
            flex: 2.8;
            min-width: 300px;
        }

        .filter-group {
            margin-bottom: 28px;
            border-bottom: 1px solid #cfdfe6;
            padding-bottom: 20px;
        }
        .filter-group label {
            font-weight: 700;
            display: block;
            margin-bottom: 12px;
            color: #1b5e5e;
            font-size: 0.95rem;
        }
        .filter-group label i { width: 28px; color: #d9a13b; }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid #c2d6df;
            background: white;
            font-size: 0.9rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3c9b85;
            box-shadow: 0 0 0 3px rgba(60,155,133,0.2);
        }

        /* Гибкие кнопки для десктопа - без переноса */
        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 8px;
        }
        .radio-group label, .checkbox-group label {
            background: #f4ede3;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            transition: 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;      /* на ноутбуке в одну строку */
        }
        .radio-group label input,
        .checkbox-group label input {
            margin: 0;
            margin-right: 0;
        }
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 12px;
        }
        .tag-option {
            background: #f4ede3;
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #d9c9b2;
            transition: 0.2s;
            white-space: nowrap;      /* на ноутбуке в одну строку */
        }
        
        /* ---------- Мобильные устройства ---------- */
        @media (max-width: 768px) {
            .radio-group, .checkbox-group {
                gap: 12px;
            }
            /* Плашки на телефоне: делаем блочными, с переносом текста и достаточным внутренним пространством */
            .radio-group label, .checkbox-group label {
                white-space: normal;        /* текст переносится */
                padding: 8px 6px;          /* увеличенный отступ, чтобы чекбокс и текст были внутри */
                font-size: 0.9rem;
                gap: 4px;                  /* расстояние между чекбоксом и текстом */
                flex: 0 0 auto;            /* не растягиваются на всю ширину, но могут быть разной ширины */
                min-width: 110px;           /* минимальная ширина, чтобы плашка не стала узкой */
                justify-content: flex-start;
                text-align: left;
                word-break: keep-all;       /* перенос по словам, не по буквам */
                overflow-wrap: break-word;
                line-height: 1.3;
            }
            .radio-group label input,
            .checkbox-group label input {
                width: 22px;      /* задаём реальную ширину */
                height: 22px;     /* и высоту */
                margin: 0;
                margin-right: 2px;  /* можно добавить совсем маленький отступ, если нужно */
                padding: 0;
                flex-shrink: 0;
                transform: none;
                vertical-align: middle;
            }
            .tag-group {
                gap: 4px;
            }
            .tag-option {
                white-space: normal;
                padding: 8px 5px;
                font-size: 0.9rem;
                gap: 3px;
                word-break: keep-all;
                overflow-wrap: break-word;
                text-align: center;
                flex: 0 1 auto;
                min-width: auto;
            }
            .filter-group label {
                font-size: 0.9rem;
            }
            .filters-sidebar {
                padding: 18px;
            }
        }
        
        /* Очень маленькие экраны (≤480px) – чуть уменьшаем отступы, но сохраняем читаемость */
        @media (max-width: 480px) {
            .radio-group, .checkbox-group {
                gap: 4px;
            }
            .radio-group label, .checkbox-group label {
                padding: 6px 10px;
                font-size: 0.85rem;
                min-width: 90px;
            }
            .radio-group label input,
            .checkbox-group label input {
                margin: 0;
                margin-right: 0;
                transform: scale(0.70);
            }
            .tag-group {
                gap: 5px;
            }
            .tag-option {
                padding: 6px 10px;
                font-size: 0.85rem;
            }
        }
        
        .tag-option:hover { background: #e3d4c0; transform: translateY(-2px); }
        .tag-option.selected {
            background: #3c9b85;
            color: white;
            border-color: #2c7a68;
            box-shadow: 0 6px 12px rgba(60,155,133,0.3);
        }

        /* Аккордеон тегов (без изменений) */
        .tag-category {
            margin-bottom: 12px;
            border: 1px solid #cfdfe6;
            border-radius: 28px;
            overflow: hidden;
            background: white;
        }
        .tag-category summary {
            font-weight: 700;
            padding: 12px 20px;
            background: #fefcf9;
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tag-category summary::-webkit-details-marker { display: none; }
        .tag-category summary::before {
            content: '\f054';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 12px;
            transition: transform 0.2s;
            margin-right: 10px;
            color: #d9a13b;
        }
        .tag-category[open] summary::before { transform: rotate(90deg); }
        .tag-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px 20px;
            background: white;
            max-height: 260px;
            overflow-y: auto;
        }
        .tag-item {
            background: #f0f4e8;
            border-radius: 32px;
            padding: 5px 16px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .tag-item.selected { background: #3c9b85; color: white; }

        .btn-primary {
            background: linear-gradient(95deg, #d9a13b, #b87c2e);
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: linear-gradient(95deg, #c78b2d, #a06822);
            transform: translateY(-2px);
        }

        /* Карточки туров */
        .tour-card {
            background: white;
            border-radius: 36px;
            box-shadow: 0 15px 30px -8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            overflow: hidden;
            transition: 0.25s;
        }
        .tour-card:hover { transform: translateY(-5px); box-shadow: 0 25px 40px -12px rgba(0,0,0,0.2); }
        .tour-header {
            padding: 24px 28px 0 28px;
            background: linear-gradient(120deg, #ffffff, #faf7f0);
        }
        .tour-header h3 { font-size: 1.7rem; font-weight: 700; color: #1b5e5e; }
        .tour-location { color: #d9a13b; margin: 8px 0; display: flex; align-items: center; gap: 8px; font-weight: 500; }
        .tour-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 0 28px;
            margin: 14px 0;
        }
        .tour-details span {
            background: #eef3ea;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .tour-tags {
            padding: 0 28px;
            margin: 12px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }
        .tour-tag {
            background: #e5d9cc;
            border-radius: 28px;
            padding: 4px 14px;
            font-size: 0.75rem;
            color: #2b5a5a;
        }
        .rating-slider {
            padding: 18px 28px 24px;
            background: #fefcf7;
            border-top: 1px solid #e2d5c4;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .rating-slider label { font-weight: 600; display: flex; align-items: center; gap: 8px; }
        input[type="range"] { flex: 2; min-width: 180px; }
        .rating-value {
            background: #d9a13b;
            color: white;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: bold;
        }
        .save-all-btn {
            background: #2c7a68;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            width: 100%;
            transition: 0.2s;
        }
        .save-all-btn:hover { background: #1f5f50; }
        .info-message {
            background: #e5f0e7;
            border-radius: 36px;
            padding: 28px;
            text-align: center;
            margin: 20px 0;
            color: #2a6b5e;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            color: #5b8c7a;
            font-size: 0.8rem;
        }
        @media (max-width: 800px) {
            .filters-sidebar { position: static; }
            .tour-header h3 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-globe-americas"></i> Рекомендатель туров</h1>
        <p>Найдите идеальное путешествие по вашим интересам</p>
    </div>

    <div class="two-columns">
        <div class="filters-sidebar">
            <h3><i class="fas fa-sliders-h"></i> Параметры поиска</h3>
            
            <!-- География: страны или направления кнопками -->
            <div class="filter-group">
                <label><i class="fas fa-globe"></i> География</label>
                <div class="radio-group" id="countryChoice">
                    <label><input type="radio" name="countryChoice" value="countries" checked> Конкретные страны</label>
                    <label><input type="radio" name="countryChoice" value="directions"> Направления</label>
                </div>
                <div id="countriesContainer" class="tag-group" style="margin-top:12px"></div>
                <div id="directionsContainer" class="tag-group" style="margin-top:12px; display:none;"></div>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-coins"></i> Бюджет (макс. руб)</label>
                <input type="number" id="budget" value="200000" step="10000">
            </div>

            <div class="filter-group">
                <label><i class="fas fa-calendar-alt"></i> Длительность (дни)</label>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 120px;">
                        <div style="font-size: 0.8rem; margin-bottom: 4px; color: #2b6a6f;">От</div>
                        <input type="number" id="durMin" value="3" placeholder="дней">
                    </div>
                    <div style="flex: 1; min-width: 120px;">
                        <div style="font-size: 0.8rem; margin-bottom: 4px; color: #2b6a6f;">До</div>
                        <input type="number" id="durMax" value="14" placeholder="дней">
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-sun"></i> Сезоны</label>
                <div class="checkbox-group" id="seasonsGroup">
                    <label><input type="checkbox" value="лето" checked> Лето</label>
                    <label><input type="checkbox" value="осень"> Осень</label>
                    <label><input type="checkbox" value="зима"> Зима</label>
                    <label><input type="checkbox" value="весна" checked> Весна</label>
                </div>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-user-friends"></i> Гид</label>
                <div class="radio-group">
                    <label><input type="radio" name="guide" value="" checked> Без разницы</label>
                    <label><input type="radio" name="guide" value="true"> Да</label>
                    <label><input type="radio" name="guide" value="false"> Нет</label>
                </div>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-users"></i> Тип поездки</label>
                <select id="groupType">
                    <option value="">Любой</option>
                    <option value="соло">Соло</option>
                    <option value="пара">Пара</option>
                    <option value="семья с детьми">Семья с детьми</option>
                    <option value="компания друзей">Компания друзей</option>
                </select>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-bed"></i> Проживание</label>
                <div class="checkbox-group" id="accommodationGroup">
                    <label><input type="checkbox" value="отель" checked> Отель</label>
                    <label><input type="checkbox" value="хостел"> Хостел</label>
                    <label><input type="checkbox" value="гостевой дом"> Гостевой дом</label>
                    <label><input type="checkbox" value="глэмпинг"> Глэмпинг</label>
                    <label><input type="checkbox" value="палатка"> Палатка</label>
                </div>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-tags"></i> Ваши интересы (теги)</label>
                <div id="tagsAccordion"></div>
                <small style="color:#2b6a6f">Выберите теги, которые вам близки – чем больше, тем точнее рекомендация</small>
            </div>

            <button class="btn-primary" id="searchBtn"><i class="fas fa-search"></i> Найти туры</button>
        </div>

        <div class="results-area">
            <div id="resultsContainer">
                <div class="info-message"><i class="fas fa-info-circle"></i> Заполните параметры и нажмите «Найти туры»</div>
            </div>
        </div>
    </div>
    <footer><i class="fas fa-chart-line"></i> Рекомендации на основе косинусного сходства выбранных тегов с тегами туров</footer>
</div>

            "утка по-пекински","хинкали","чай","чайная церемония","чайные домики",
            "чайные плантации","шашлык","ягоды","фо-бо"
        ],
        "Релакс и здоровье": [
            "горячие источники","здоровье","йога","йога медитация","медитация","минеральные воды",
            "минеральные источники","онсэн","релакс","санаторий","сауна","спа","спокойный отдых",
            "спокойствие","тишина","термальные источники","прогулки"
        ],
        "Город и развлечения": [
            "аквапарк","аттракционы","вечерние шоу","городской","детские игры","детские площадки",
            "детские программы","молодежь","ночная жизнь","олимпийские объекты","парки","тусовка",
            "уютные кафе","шопинг","фестивали","клубы","аниматор","мастер-классы","керамика","сувениры"
        ],
        "Тип поездки": [
            "групповой","одиночное путешествие","романтический","семейный","соло","уединение","пешие прогулки"
        ],
        "Размещение и сервис": [
            "всё включено","технологичный туризм","экологичный"
        ]
    };

    // ---------- Загрузка и обработка данных ----------
    async function loadTours() {
        const resp = await fetch('tours.csv');
        const text = await resp.text();
        const lines = text.split('\n');
        const headers = lines[0].split(';').map(h => h.trim());
        const tours = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = lines[i].split(';');
            let obj = {};
            headers.forEach((h, idx) => {
                let val = values[idx]?.trim() || '';
                if (h === 'стоимость_руб_чел' || h === 'длительность_дни') val = parseInt(val) || 0;
                obj[h] = val;
            });
            ['тип_группы', 'сезон', 'тип_проживания', 'список_тегов'].forEach(f => {
                if (obj[f] && typeof obj[f] === 'string')
                    obj[f] = obj[f].split(',').map(s => s.trim()).filter(s => s);
                else obj[f] = [];
            });
            tours.push(obj);
        }
        return tours;
    }

    function buildAllTags(tours) {
        const set = new Set();
        tours.forEach(t => t['список_тегов'].forEach(tg => set.add(tg)));
        return Array.from(set).sort();
    }

    function addTagVectors(tours, allTags) {
        tours.forEach(t => {
            t.tagVector = allTags.map(tag => t['список_тегов'].includes(tag) ? 1 : 0);
        });
    }

    function cosineSimilarity(a, b) {
        let dot = 0, magA = 0, magB = 0;
        for (let i = 0; i < a.length; i++) {
            dot += a[i] * b[i];
            magA += a[i] * a[i];
            magB += b[i] * b[i];
        }
        if (magA === 0 || magB === 0) return 0;
        return dot / (Math.sqrt(magA) * Math.sqrt(magB));
    }

    function buildTagCategories(allTags) {
        const cats = {};
        const used = new Set();
        for (let [name, list] of Object.entries(TAG_CATEGORIES_RAW)) {
            const present = list.filter(t => allTags.includes(t));
            if (present.length) {
                cats[name] = present;
                present.forEach(t => used.add(t));
            }
        }
        const leftover = allTags.filter(t => !used.has(t));
        if (leftover.length) cats["Другое"] = leftover;
        return cats;
    }

    function renderTagsAccordion(cats) {
        const container = document.getElementById('tagsAccordion');
        container.innerHTML = '';
        for (let [catName, tags] of Object.entries(cats)) {
            const details = document.createElement('details');
            details.className = 'tag-category';
            const summary = document.createElement('summary');
            summary.innerHTML = `<i class="fas fa-tag"></i> ${catName}`;
            details.appendChild(summary);
            const div = document.createElement('div');
            div.className = 'tag-grid';
            tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'tag-item';
                if (selectedTags.has(tag)) span.classList.add('selected');
                span.innerHTML = `<i class="fas fa-hashtag"></i> ${tag}`;
                span.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedTags.has(tag)) {
                        selectedTags.delete(tag);
                        span.classList.remove('selected');
                    } else {
                        selectedTags.add(tag);
                        span.classList.add('selected');
                    }
                };
                div.appendChild(span);
            });
            details.appendChild(div);
            container.appendChild(details);
        }
    }

    // ---------- География (удобные кнопки) ----------
    let selectedCountries = new Set();
    let selectedDirections = new Set();

    function initGeography(allCountries) {
        const countriesDiv = document.getElementById('countriesContainer');
        const dirsDiv = document.getElementById('directionsContainer');
        const directionNames = Object.values(DIRECTION_DISPLAY);

        const render = (container, items, selectedSet, onClick) => {
            container.innerHTML = '';
            items.forEach(item => {
                const btn = document.createElement('span');
                btn.className = 'tag-option';
                if (selectedSet.has(item)) btn.classList.add('selected');
                btn.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${item}`;
                btn.onclick = () => onClick(item, btn);
                container.appendChild(btn);
            });
        };

        const toggleCountry = (country, el) => {
            if (selectedCountries.has(country)) {
                selectedCountries.delete(country);
                el.classList.remove('selected');
            } else {
                selectedCountries.add(country);
                el.classList.add('selected');
            }
        };
        const toggleDirection = (dir, el) => {
            if (selectedDirections.has(dir)) {
                selectedDirections.delete(dir);
                el.classList.remove('selected');
            } else {
                selectedDirections.add(dir);
                el.classList.add('selected');
            }
        };

        render(countriesDiv, allCountries, selectedCountries, toggleCountry);
        render(dirsDiv, directionNames, selectedDirections, toggleDirection);

        document.querySelectorAll('input[name="countryChoice"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const isCountries = e.target.value === 'countries';
                countriesDiv.style.display = isCountries ? 'flex' : 'none';
                dirsDiv.style.display = isCountries ? 'none' : 'flex';
            });
        });
    }

    function getSelectedCountries() {
        const choice = document.querySelector('input[name="countryChoice"]:checked').value;
        if (choice === 'countries') return Array.from(selectedCountries);
        const countries = [];
        for (let dir of selectedDirections) {
            const key = Object.keys(DIRECTION_DISPLAY).find(k => DIRECTION_DISPLAY[k] === dir);
            if (key && DIRECTION_MAP[key]) countries.push(...DIRECTION_MAP[key]);
        }
        return [...new Set(countries)];
    }

    // ---------- Рекомендация ----------
    function recommendTours(prefs) {
        let filtered = [...toursData];
        if (prefs.countries.length) filtered = filtered.filter(t => prefs.countries.includes(t['страна']));
        if (prefs.budgetMax) filtered = filtered.filter(t => t['стоимость_руб_чел'] <= prefs.budgetMax);
        filtered = filtered.filter(t => t['длительность_дни'] >= prefs.durMin && t['длительность_дни'] <= prefs.durMax);
        if (prefs.seasons.length) filtered = filtered.filter(t => t['сезон'].some(s => prefs.seasons.includes(s)));
        if (prefs.guide !== null) filtered = filtered.filter(t => t['наличие_гида'] === prefs.guide);
        if (prefs.groupType) filtered = filtered.filter(t => t['тип_группы'].includes(prefs.groupType));
        if (prefs.accommodation.length) filtered = filtered.filter(t => t['тип_проживания'].some(p => prefs.accommodation.includes(p)));
        if (!filtered.length) return [];

        if (prefs.selectedTags.length) {
            const userVec = allTagsList.map(tag => prefs.selectedTags.includes(tag) ? 1 : 0);
            filtered.forEach(t => { t.similarity = cosineSimilarity(userVec, t.tagVector); });
            filtered.sort((a,b) => b.similarity - a.similarity);
        } else {
            filtered.forEach(t => t.similarity = 0);
            filtered = filtered.slice(0, 10);
        }
        return filtered.slice(0, 5);
    }

    function displayTours(tours) {
        const container = document.getElementById('resultsContainer');
        if (!tours.length) {
            container.innerHTML = '<div class="info-message"><i class="fas fa-info-circle"></i> Нет туров, подходящих под ваши критерии. Расширьте параметры поиска.</div>';
            return;
        }
        let html = '';
        tours.forEach(tour => {
            const location = (tour['страна'] === 'Россия' && tour['регион']) ? `Россия, ${tour['регион']}` : tour['страна'];
            const allTagsHtml = tour['список_тегов'].map(t => `<span class="tour-tag">${escapeHtml(t)}</span>`).join('');
            html += `
                <div class="tour-card" data-tour-id="${tour.id}">
                    <div class="tour-header">
                        <h3>${escapeHtml(tour['название'])}</h3>
                        <div class="tour-location"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(location)}</div>
                    </div>
                    <div class="tour-details">
                        <span><i class="fas fa-clock"></i> ${tour['длительность_дни']} дней</span>
                        <span><i class="fas fa-ruble-sign"></i> ${tour['стоимость_руб_чел'].toLocaleString()} руб/чел</span>
                        <span><i class="fas fa-home"></i> ${tour['тип_проживания'].slice(0,2).join(', ')}</span>
                    </div>
                    <div class="tour-tags">${allTagsHtml}</div>
                    <div class="rating-slider">
                        <label><i class="fas fa-star"></i> Оценка (1-10):</label>
                        <input type="range" min="1" max="10" value="5" class="rating-input" data-id="${tour.id}">
                        <span class="rating-value" data-id="${tour.id}">5</span>
                        <label><i class="fas fa-star"></i> 1 - не подходит под критерии, 10 - идельно подходит под критерии</label>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        document.querySelectorAll('.rating-input').forEach(slider => {
            slider.addEventListener('input', (e) => {
                const span = document.querySelector(`.rating-value[data-id="${slider.dataset.id}"]`);
                if (span) span.innerText = e.target.value;
            });
        });
        if (!document.getElementById('globalSaveBtn')) {
            const saveBtn = document.createElement('button');
            saveBtn.id = 'globalSaveBtn';
            saveBtn.className = 'save-all-btn';
            saveBtn.innerHTML = '<i class="fas fa-save"></i> Сохранить все оценки';
            saveBtn.onclick = saveAllRatings;
            container.appendChild(saveBtn);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => (m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'));
    }

    async function saveAllRatings() {
        const prefs = collectUserPrefs();
        const ratings = [];
        document.querySelectorAll('.tour-card').forEach(card => {
            const tid = card.dataset.tourId;
            const slider = card.querySelector('.rating-input');
            const rating = slider ? slider.value : null;
            const tour = toursData.find(t => t.id == tid);
            if (tour && rating) {
                ratings.push({
                    user_budget: prefs.budgetMax,
                    user_duration_min: prefs.durMin,
                    user_duration_max: prefs.durMax,
                    user_seasons: prefs.seasons.join(','),
                    user_guide: prefs.guide,
                    user_group_type: prefs.groupType || '',
                    user_accommodation: prefs.accommodation.join(','),
                    user_countries: (prefs.countries || []).join(','),
                    user_tags: prefs.selectedTags.join(','),
                    tour_id: tour.id,
                    tour_name: tour['название'],
                    tour_country: tour['страна'],
                    tour_duration: tour['длительность_дни'],
                    tour_price: tour['стоимость_руб_чел'],
                    rating: rating
                });
            }
        });
        if (!ratings.length) { alert('Нет оценок для сохранения'); return; }

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWWcn1rv7BbuQAUxLvIk3udQVyOyikenFCAuF9DfCzJyGSkqkKvLAbwPV5aRvyel66/exec'; 
        try {
            for (let r of ratings) {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(r)
                });
            }
            alert('Оценки сохранены! Спасибо за обратную связь.');
        } catch(e) {
            console.error(e);
            alert('Ошибка при сохранении: ' + e.message);
        }
    }

    function collectUserPrefs() {
        const seasons = Array.from(document.querySelectorAll('#seasonsGroup input:checked')).map(cb => cb.value);
        const guideRadio = document.querySelector('input[name="guide"]:checked');
        let guideVal = null;
        if (guideRadio.value === 'true') guideVal = true;
        else if (guideRadio.value === 'false') guideVal = false;
        const accommodation = Array.from(document.querySelectorAll('#accommodationGroup input:checked')).map(cb => cb.value);
        return {
            countries: getSelectedCountries(),
            budgetMax: parseInt(document.getElementById('budget').value) || Infinity,
            durMin: parseInt(document.getElementById('durMin').value) || 0,
            durMax: parseInt(document.getElementById('durMax').value) || 999,
            seasons,
            guide: guideVal,
            groupType: document.getElementById('groupType').value,
            accommodation,
            selectedTags: Array.from(selectedTags)
        };
    }

    async function performSearch() {
        const prefs = collectUserPrefs();
        const recs = recommendTours(prefs);
        displayTours(recs);
    }

    window.onload = async () => {
        toursData = await loadTours();
        allTagsList = buildAllTags(toursData);
        addTagVectors(toursData, allTagsList);
        const cats = buildTagCategories(allTagsList);
        renderTagsAccordion(cats);
        const countries = [...new Set(toursData.map(t => t['страна']))].sort();
        initGeography(countries);
        document.getElementById('searchBtn').onclick = performSearch;
        performSearch();
    };
</script>
